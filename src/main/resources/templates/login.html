<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 100px auto; text-align: center; }
        input { padding: 10px; width: 250px; margin: 8px 0; font-size: 16px; border: 2px solid #ddd; border-radius: 6px; }
        button { padding: 10px 30px; background: #008CBA; color: white; border: none; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .erreur { color: red; }
        a { color: #008CBA; }
    </style>
</head>
<body>
<h1>🔑 Connexion</h1>

<p th:if="${param.error}" class="erreur">Identifiants incorrects !</p>
<p th:if="${param.logout}">Vous avez été déconnecté.</p>

<form action="/login" method="post">
    <div><input type="text"     name="username" placeholder="Nom d'utilisateur" required/></div>
    <div><input type="password" name="password" placeholder="Mot de passe"      required/></div>
    <button type="submit">Se connecter</button>
</form>

<p>Pas encore de compte ? <a href="/register">S'inscrire</a></p>
<p><a href="/">← Retour accueil</a></p>
</body>
</html>
